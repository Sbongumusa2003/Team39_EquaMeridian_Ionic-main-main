<ion-tabs>
  <ion-tab-bar slot="bottom">
    @if ((role$ | async)?.role?.toLowerCase() === 'supplier') {
      <ion-tab-button tab="supplier" href="/tabs/supplier">
        <ion-icon name="storefront-outline"></ion-icon><ion-label>Hub</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="listings" href="/tabs/listings">
        <ion-icon name="cube-outline"></ion-icon><ion-label>Listings</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="quotations" href="/tabs/quotations">
        <ion-icon name="document-text-outline"></ion-icon><ion-label>Quotes</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="bookings" href="/tabs/bookings">
        <ion-icon name="calendar-outline"></ion-icon><ion-label>Bookings</ion-label>
      </ion-tab-button>
    } @else {
      <ion-tab-button tab="home" href="/tabs/home">
        <ion-icon name="home-outline"></ion-icon><ion-label>Home</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="browse" href="/tabs/browse">
        <ion-icon name="search-outline"></ion-icon><ion-label>Browse</ion-label>
      </ion-tab-button>
      @if ((role$ | async)?.role?.toLowerCase() === 'contractor') {
        <ion-tab-button tab="cart" href="/tabs/cart">
          <ion-icon name="cart-outline"></ion-icon><ion-label>Cart</ion-label>
          @if ((cart.itemCount$ | async); as n) { <ion-badge>{{ n }}</ion-badge> }
        </ion-tab-button>
        <ion-tab-button tab="bookings" href="/tabs/bookings">
          <ion-icon name="calendar-outline"></ion-icon><ion-label>Bookings</ion-label>
        </ion-tab-button>
      }
    }
    <ion-tab-button tab="account" href="/tabs/account">
      <ion-icon name="person-outline"></ion-icon><ion-label>Account</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
